name: Generate weekly blog post

on:
  # 定期実行を停止した（2026-07-15）。以前は毎日→週1に減速していたが、ペースの問題ではない。
  #
  # 自動生成の「○月の新作まとめ」は同じブランドを入れ替えただけの記事で、2026年6月だけで
  # 23本が公開されていた。これはGoogleが「スケールされたコンテンツの不正使用」として
  # 禁止している形で、AdSenseの「低品質コンテンツ」不承認の主因である可能性が高い。
  # GSC実測ではブログ24本の合計が28日で6クリック（サイト全体の1.8%）しかなく、
  # 稼いでいないのに審査リスクだけを積み増していた。
  #
  # 記事側も lib/quality.js で evergreen 以外を noindex にしている。
  # 再開するなら「量産まとめ」ではなく独自ガイド（evergreen: true）を書く形に変えること。
  # schedule:
  #   - cron: '30 22 * * 1'  # 毎週月曜 7:30 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog-posts.json
          git diff --staged --quiet || (git commit -m "chore: auto-generate blog post $(date +%Y-%m-%d)" && git push)
