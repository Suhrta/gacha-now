# .github/workflows/publish-instagram.yml
# Instagram投稿のバックフィル（手動再実行）用。
# - public/posts/ に既にある post-YYYY-MM-DD-*.png / .txt を対象に Instagram Graph API で投稿する。
# - 失敗時に再実行できるよう、日付を指定して実行する。

name: Publish Instagram (Backfill)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '投稿対象日 (YYYY-MM-DD)'
        required: true
        type: string
      dry_run:
        description: 'true の場合は投稿せず対象ファイルの列挙だけ行う'
        required: false
        type: boolean
        default: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (scripts)
        run: |
          cd scripts
          npm install

      - name: Publish to Instagram (target_date)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_DATE: ${{ inputs.target_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-instagram.js

      - name: Commit posted log (if changed)
        if: ${{ inputs.dry_run == false }}
        run: |
          if [ ! -f data/instagram-posted-log.json ]; then
            echo "posted log not found; skip"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram-posted-log.json
          git diff --staged --quiet || git commit -m "chore: Instagram投稿ログを更新"
          git push
