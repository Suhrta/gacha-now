name: Update Products
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd scripts
          npm install
      - name: Collect gacha data
        run: node scripts/collect.js
      - name: Structure data
        run: node scripts/structure.js
      - name: Update products.json
        run: node scripts/update.js
      - name: Generate Instagram posts
        run: node scripts/generate-post.js
      - name: Copy posts to public directory
        run: |
          mkdir -p public/posts
          cp posts/*.png public/posts/ 2>/dev/null || true
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json posts/ public/posts/
          git diff --staged --quiet || git commit -m "auto-update products $(date -u +%Y-%m-%d)"
          git push
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          NEW_COUNT=0
          if [ -f "data/new-today.json" ]; then
            NEW_COUNT=$(python3 -c "import json; print(len(json.load(open('data/new-today.json'))))" 2>/dev/null || echo "0")
          fi
          if [ "$NEW_COUNT" -gt 0 ]; then
            COUNT=0
            for PNG_FILE in posts/post-${TODAY}-*.png; do
              [ -f "$PNG_FILE" ] || continue
              IDX=$(echo "$PNG_FILE" | grep -oP '\d+(?=\.png$)')
              TXT_FILE="posts/post-${TODAY}-${IDX}.txt"
              if [ -f "$TXT_FILE" ]; then
                CAPTION=$(cat "$TXT_FILE")
                curl -s -F "content=${CAPTION}" -F "file1=@${PNG_FILE}" "$DISCORD_WEBHOOK_URL"
                COUNT=$((COUNT + 1))
                sleep 2
              fi
            done
            echo "Discord: ${COUNT} new items notified"
          else
            curl -s -H "Content-Type: application/json" -d '{"content":"\ud83d\udce2 \u672c\u65e5\u306e\u65b0\u4f5c\u30ac\u30c1\u30e3\u60c5\u5831\u306f\u3042\u308a\u307e\u305b\u3093\u3067\u3057\u305f\u3002\n\n\u6700\u65b0\u306e\u30ac\u30c1\u30e3\u60c5\u5831\u306f\u3053\u3061\u3089\u304b\u3089\u30c1\u30a7\u30c3\u30af\uff01\n\ud83d\udd17 https://gacha-now.vercel.app"}' "$DISCORD_WEBHOOK_URL"
            echo "Discord: no new items notification sent"
          fi
      - name: Wait for Vercel deployment
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ ! -f "posts/post-${TODAY}-1.png" ]; then
            echo "No post files, skip deploy wait"
            exit 0
          fi
          echo "Waiting 60s for Vercel deploy..."
          sleep 60
      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish-instagram.js
