# .github/workflows/update-products.yml
#
# 毎朝9時（日本時間）に:
# 1. バンダイ・タカトミ公式サイトからガチャ新作情報を収集
# 2. データを整形
# 3. products.jsonを更新
# 4. 新規商品があれば件数分の投稿画像を生成
# 5. 変更があればgit push → Vercelが自動デプロイ
# 6. Discordに通知
# 7. Instagramに自動投稿
name: Update Products
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd scripts
          npm install
      - name: Collect gacha data
        run: node scripts/collect.js
      - name: Structure data
        run: node scripts/structure.js
      - name: Update products.json
        run: node scripts/update.js
      - name: Generate Instagram posts
        run: node scripts/generate-post.js
      - name: Copy posts to public directory
        run: |
          mkdir -p public/posts
          cp posts/*.png public/posts/ 2>/dev/null || true
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json posts/ public/posts/
          git diff --staged --quiet || git commit -m "🎪 auto-update products $(date -u +%Y-%m-%d)"
          git push
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=0
          for PNG_FILE in posts/post-${TODAY}-*.png; do
            [ -f "$PNG_FILE" ] || continue
            IDX=$(echo "$PNG_FILE" | grep -oP '\d+(?=\.png$)')
            TXT_FILE="posts/post-${TODAY}-${IDX}.txt"
            if [ -f "$TXT_FILE" ]; then
              CAPTION=$(cat "$TXT_FILE")
              curl -s -F "content=${CAPTION}" -F "file1=@${PNG_FILE}" "$DISCORD_WEBHOOK_URL"
              COUNT=$((COUNT + 1))
              sleep 2
            fi
          done
          if [ "$COUNT" -gt 0 ]; then
            echo "✅ Discord通知完了（${COUNT}件）"
          else
            echo "⚠️ 投稿ファイルが見つかりません、スキップ"
          fi
      - name: Wait for Vercel deployment
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          FIRST_PNG="posts/post-${TODAY}-1.png"
          if [ ! -f "$FIRST_PNG" ]; then
            echo "⏭️ 投稿ファイルなし、デプロイ待機スキップ"
            exit 0
          fi
          echo "⏳ Vercelデプロイ完了を60秒待機..."
          sleep 60
          IMG_URL="https://gacha-now.vercel.app/posts/post-${TODAY}-1.png"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$IMG_URL")
          if [ "$STATUS" = "200" ]; then
            echo "✅ 画像URLが有効です: $IMG_URL"
          else
            echo "⚠️ 画像URLがまだ無効 (HTTP $STATUS)、追加30秒待機..."
            sleep 30
          fi
      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish-instagram.js
