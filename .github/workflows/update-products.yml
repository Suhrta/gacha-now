# .github/workflows/update-products.yml
#
# 毎朝9時（日本時間）に:
# 1. バンダイ・タカトミ公式サイトからガチャ新作情報を収集
# 2. データを整形・更新
# 3. AI紹介文を生成
# 4. Instagram投稿用画像を生成 → public/posts/ に保存
# 5. git push → Vercelが自動デプロイ

name: Update Products
on:
  schedule:
    # 毎日 0:00 UTC = 日本時間 9:00
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Collect gacha data
        run: node scripts/collect.js

      - name: Structure data
        run: node scripts/structure.js

      - name: Update products.json
        run: node scripts/update.js

      - name: Generate AI descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-descriptions.js

      - name: Generate Instagram post images
        run: node scripts/generate-post.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/new-today.json public/posts/
          git diff --staged --quiet || git commit -m "🎪 auto-update products $(date -u +%Y-%m-%d)"
          git push
