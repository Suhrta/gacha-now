# .github/workflows/update-products.yml
#
# 毎朝9時（日本時間）に:
# 1. バンダイ・タカトミ公式サイトからガチャ新作情報を収集
# 2. データを整形
# 3. products.jsonを更新
# 4. 変更があればgit push → Vercelが自動デプロイ

name: Update Products
on:
  schedule:
    # 毎日 0:00 UTC = 日本時間 9:00
    - cron: '0 0 * * *'
  # 手動実行も可能（テスト用）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. puppeteer等の依存パッケージをインストール
      - name: Install dependencies
        run: |
          cd scripts
          npm install

      # 4. データ収集（バンダイ・タカトミからスクレイピング）
      - name: Collect gacha data
        run: node scripts/collect.js

      # 4. データ整形（Claude API不要、ローカル処理のみ）
      - name: Structure data
        run: node scripts/structure.js

      # 5. products.json を更新
      - name: Update products.json
        run: node scripts/update.js

      # 6. Instagram投稿画像を生成
      - name: Generate Instagram post
        run: node scripts/generate-post.js

      # 7. 変更があれば自動commit & push
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json posts/
          git diff --staged --quiet || git commit -m "🎪 auto-update products $(date -u +%Y-%m-%d)"
          git push
