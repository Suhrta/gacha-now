# .github/workflows/update-products.yml
#
# 毎朝9時（日本時間）に:
# 1. バンダイ・タカトミ公式サイトからガチャ新作情報を収集
# 2. データを整形
# 3. products.jsonを更新
# 4. 変更があればgit push → Vercelが自動デプロイ

name: Update Products
on:
  schedule:
    # 毎日 0:00 UTC = 日本時間 9:00
    - cron: '0 0 * * *'
  # 手動実行も可能（テスト用）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. puppeteer等の依存パッケージをインストール
      - name: Install dependencies
        run: |
          cd scripts
          npm install

      # 4. データ収集（バンダイ・タカトミからスクレイピング）
      - name: Collect gacha data
        run: node scripts/collect.js

      # 4. データ整形（Claude API不要、ローカル処理のみ）
      - name: Structure data
        run: node scripts/structure.js

      # 5. products.json を更新
      - name: Update products.json
        run: node scripts/update.js

      # 6. AI紹介文を生成（descriptionが無い商品のみ）
      - name: Generate AI descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-descriptions.js

      # 7. Instagram投稿画像を生成
      - name: Generate Instagram post
        run: node scripts/generate-post.js

      # 7. 変更があれば自動commit & push
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json posts/
          git diff --staged --quiet || git commit -m "🎪 auto-update products $(date -u +%Y-%m-%d)"
          git push

      # 8. Discordに投稿画像とキャプションを通知
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PNG_FILE="posts/post-${TODAY}.png"
          TXT_FILE="posts/post-${TODAY}.txt"

          if [ -f "$PNG_FILE" ] && [ -f "$TXT_FILE" ]; then
            CAPTION=$(cat "$TXT_FILE")
            curl -s -F "content=${CAPTION}" -F "file1=@${PNG_FILE}" "$DISCORD_WEBHOOK_URL"
            echo "✅ Discord通知完了"
          else
            echo "⚠️ 投稿ファイルが見つかりません、スキップ"
          fi
