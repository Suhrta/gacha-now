# .github/workflows/update-products.yml
#
# 毎日 8時・12時・17時（日本時間）に:
# 1. バンダイ・タカトミ公式サイトからガチャ新作情報を収集
# 2. データを整形・更新
# 3. AI紹介文を生成（新着のみ）
# 4. Instagram投稿用画像を生成（新着のみ） → public/posts/ に保存
# 5. git push → Vercelが自動デプロイ
# 6. Vercelデプロイ待機（60秒）
# 7. Instagram投稿（新着なければスキップ）
# 8. Discord通知（新着あり → 画像送信 / 新着なし → 「本日の新着なし」メッセージ）

name: Update Products

concurrency:
  # 手動バックフィルと定期実行が重なっても、投稿やログ更新が競合しないように直列化する
  group: instagram-publish
  cancel-in-progress: false

on:
  schedule:
    # 毎日 23:00 UTC = 日本時間 8:00
    - cron: '0 23 * * *'
    # 毎日 3:00 UTC = 日本時間 12:00
    - cron: '0 3 * * *'
    # 毎日 8:00 UTC = 日本時間 17:00
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      # 投稿ステップより前に置くことで、後続が失敗してもトークン警告は必ず届く
      - name: Check Instagram token expiry
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-ig-token.js

      - name: Collect gacha data
        run: node scripts/collect.js

      - name: Structure data
        run: node scripts/structure.js

      - name: Update products.json
        run: node scripts/update.js

      # update.js は既存商品に触れないため、BRAND_MAP を拡張しても過去分は
      # 「その他」のまま noindex され続ける。ここで再判定して取りこぼしを回収する。
      - name: Re-detect brands for existing products
        run: node scripts/rebrand.js

      # 収集元の公式ページから一次情報（公式紹介文・サイズ・ラインナップ内訳・対象年齢）を取得する。
      # collect.js は一覧ページからしか情報を取っておらず、これらは商品詳細ページ側にある。
      # 特に「ラインナップ内訳」は収録キャラ名が入るため、商品ページが
      # 「○○ ガチャ」級のロングテールを持てるようになる（2026-08-07 追加）。
      #
      # 未取得のものだけを対象にするので、毎日の実行では新商品ぶんしか叩かない。
      # gashapon.jp はまとめて叩くとレート制限に掛かるため既定を2並列/500msにしている。
      #
      # continue-on-error: 収集元の一時的な不調でパイプライン全体を止めない
      # （取れなかった商品は翌日の実行で再挑戦される）。
      - name: Enrich with official product info
        continue-on-error: true
        run: node scripts/enrich-official.js

      # 各商品の楽天「コンプセット/予約」検索クエリを楽天APIで検証して生成
      # （0件・無関係リンクを出さない。新商品と古い項目だけAPIを叩くので軽量）
      #
      # Origin は秘密情報ではなく固定値なので scripts/rakuten-api.js の既定値を使う
      # （Secret化すると値の綴り違いに気づけず全件403になるため渡さない）。
      #
      # continue-on-error: 楽天API側の障害でこのステップが落ちても、商品更新・Instagram・
      # Discord という本体パイプラインは止めない（リンクは前回生成分がそのまま残り無害）。
      - name: Build Rakuten purchase links
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: node scripts/build-rakuten-links.js

      - name: Generate AI descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-descriptions.js

      # 一覧のサムネイルを自前生成して public/thumb/ に置く。
      # Vercelの画像最適化（Hobby無料枠）を使い切って新規変換が402で止まったため、
      # next/image をやめてこれを素の<img>で配信している。
      # 未生成のぶんだけ作るので、毎日の実行で叩くのは新商品ぶんだけ。
      #
      # continue-on-error: 仕入れ元CDNの一時的な不調でパイプライン全体を止めない。
      # 取れなかった商品は仕入れ元URLで表示され、翌日の実行で再挑戦される。
      - name: Build product thumbnails
        continue-on-error: true
        run: node scripts/build-thumbs.js

      - name: Generate Instagram post images
        run: node scripts/generate-post.js

      # 投稿画像はInstagram公開後は不要（サイトからは未参照）。
      # 残し続けるとデプロイサイズが際限なく増えるため古いものを落とす。
      - name: Remove old post images
        run: node scripts/cleanup-posts.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/new-today.json data/collected.json data/rakuten-links.json
          git add -A public/posts/
          git add -A public/thumb/
          git diff --staged --quiet || git commit -m "🎪 auto-update products $(date -u +%Y-%m-%d)"
          git push

      - name: Wait for Vercel deploy
        run: |
          echo "⏳ Vercelデプロイ待機 (60秒)..."
          sleep 60

      # 更新したURLをIndexNow（Bing/Yandex等）に即時通知する。
      # GA4実測(2026-08-19)で bing/organic が流入の約4割を占めており、
      # 1日3回更新するこのサイトはプッシュ通知の効きが大きい。
      #
      # デプロイ待機の「後」に置くこと。先に通知すると、まだ反映されていない
      # 古い内容をクロールされて逆効果になる。
      #
      # continue-on-error: 通知は補助施策なので、失敗してもInstagram投稿や
      # Discord通知という本体パイプラインは止めない。
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/ping-indexnow.js

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish-instagram.js

      - name: Commit Instagram posted log (if changed)
        run: |
          if [ ! -f data/instagram-posted-log.json ]; then
            echo "posted log not found; skip"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram-posted-log.json
          git diff --staged --quiet || git commit -m "chore: Instagram投稿ログを更新"
          git push

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 今回のランで新規追加があるか確認
          NEW_COUNT=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('data/new-today.json','utf8'));console.log(d.length)}catch(e){console.log(0)}")
          TODAY=$(date -u +%Y-%m-%d)
          # 今回生成されたファイルのみ対象（JST時間で絞り込み）
          JST_HOUR=$(node -e "const h=(new Date().getUTCHours()+9)%24; console.log(String(h).padStart(2,'0'))")
          SENT=0

          if [ "$NEW_COUNT" -gt 0 ]; then
            for PNG_FILE in public/posts/post-${TODAY}-${JST_HOUR}h-*.png; do
              [ -f "$PNG_FILE" ] || continue
              TXT_FILE="${PNG_FILE%.png}.txt"

              if [ -f "$TXT_FILE" ]; then
                CAPTION=$(cat "$TXT_FILE")
                curl -s -F "content=${CAPTION}" -F "file1=@${PNG_FILE}" "$DISCORD_WEBHOOK_URL"
                SENT=$((SENT + 1))
                sleep 2
              fi
            done
          fi

          if [ "$SENT" -gt 0 ]; then
            echo "✅ Discord通知完了: ${SENT}件"
          else
            curl -s -H "Content-Type: application/json" \
              -d '{"content":"📢 本日の新着ガチャ情報はありませんでした。\n\n最新のガチャ情報はこちらからチェック！\n🔗 https://gacha-now.net"}' \
              "$DISCORD_WEBHOOK_URL"
            echo "⏭️ 新着なし、Discord通知（新着なしメッセージ）を送信"
          fi

      # 退役商品の301は next.config.js が毎ビルド組み立てる。保持365日なので
      # 消えずに積み上がり、月初の一斉入荷（毎月125〜153件）が3ヶ月後の退役で
      # そのまま乗ってくる。2026-09-02時点で506件。
      #
      # Vercelにはルート数の上限があり、超えると「next build は通るのに本番
      # デプロイだけ落ちる」という壊れ方をする。2026-09-01のEdge Function
      # 1MB超過（OG画像がproducts.jsonをimportしていた）と同じで、ローカルでは
      # 再現しないため切り分けに丸一日かかった。同じ轍を踏まないよう先に知らせる。
      #
      # 対処は next.config.js の RETENTION_DAYS を縮めるだけ。
      # 件数は next.config.js の redirects() をそのまま呼んで数える
      # （ここにロジックを写すと本体と必ずズレるため）。
      #
      # continue-on-error: 警告は補助施策なので、失敗してもパイプラインは止めない。
      - name: Warn if redirects are piling up
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WARN_THRESHOLD: '800'
        run: |
          COUNT=$(node -e "require('./next.config.js').redirects().then(r=>console.log(r.length))")
          echo "リダイレクト数: ${COUNT} / 閾値 ${WARN_THRESHOLD}"

          if [ "$COUNT" -ge "$WARN_THRESHOLD" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **リダイレクトが ${COUNT} 件**になりました（閾値 ${WARN_THRESHOLD}）。\nVercelのルート数上限に近づいています。超えると本番デプロイだけが落ちます（next build では気づけません）。\n対処: next.config.js の RETENTION_DAYS を縮めて古い301を落としてください。\"}" \
              "$DISCORD_WEBHOOK_URL"
            echo "⚠️ 閾値超過をDiscordに通知しました"
          fi

