# .github/workflows/update-products.yml
#
# 毎日 8時・12時・17時（日本時間）に:
# 1. バンダイ・タカトミ公式サイトからガチャ新作情報を収集
# 2. データを整形・更新
# 3. AI紹介文を生成（新着のみ）
# 4. Instagram投稿用画像を生成（新着のみ） → public/posts/ に保存
# 5. git push → Vercelが自動デプロイ
# 6. Vercelデプロイ待機（60秒）
# 7. Instagram投稿（新着なければスキップ）
# 8. Discord通知（新着あり → 画像送信 / 新着なし → 「本日の新着なし」メッセージ）

name: Update Products

concurrency:
  # 手動バックフィルと定期実行が重なっても、投稿やログ更新が競合しないように直列化する
  group: instagram-publish
  cancel-in-progress: false

on:
  schedule:
    # 毎日 23:00 UTC = 日本時間 8:00
    - cron: '0 23 * * *'
    # 毎日 3:00 UTC = 日本時間 12:00
    - cron: '0 3 * * *'
    # 毎日 8:00 UTC = 日本時間 17:00
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      # 投稿ステップより前に置くことで、後続が失敗してもトークン警告は必ず届く
      - name: Check Instagram token expiry
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/check-ig-token.js

      - name: Collect gacha data
        run: node scripts/collect.js

      - name: Structure data
        run: node scripts/structure.js

      - name: Update products.json
        run: node scripts/update.js

      # update.js は既存商品に触れないため、BRAND_MAP を拡張しても過去分は
      # 「その他」のまま noindex され続ける。ここで再判定して取りこぼしを回収する。
      - name: Re-detect brands for existing products
        run: node scripts/rebrand.js

      # 収集元の公式ページから一次情報（公式紹介文・サイズ・ラインナップ内訳・対象年齢）を取得する。
      # collect.js は一覧ページからしか情報を取っておらず、これらは商品詳細ページ側にある。
      # 特に「ラインナップ内訳」は収録キャラ名が入るため、商品ページが
      # 「○○ ガチャ」級のロングテールを持てるようになる（2026-08-07 追加）。
      #
      # 未取得のものだけを対象にするので、毎日の実行では新商品ぶんしか叩かない。
      # gashapon.jp はまとめて叩くとレート制限に掛かるため既定を2並列/500msにしている。
      #
      # continue-on-error: 収集元の一時的な不調でパイプライン全体を止めない
      # （取れなかった商品は翌日の実行で再挑戦される）。
      - name: Enrich with official product info
        continue-on-error: true
        run: node scripts/enrich-official.js

      # 各商品の楽天「コンプセット/予約」検索クエリを楽天APIで検証して生成
      # （0件・無関係リンクを出さない。新商品と古い項目だけAPIを叩くので軽量）
      #
      # Origin は秘密情報ではなく固定値なので scripts/rakuten-api.js の既定値を使う
      # （Secret化すると値の綴り違いに気づけず全件403になるため渡さない）。
      #
      # continue-on-error: 楽天API側の障害でこのステップが落ちても、商品更新・Instagram・
      # Discord という本体パイプラインは止めない（リンクは前回生成分がそのまま残り無害）。
      #
      # 【2026-10-11】「前回生成分が残り無害」は短い障害の前提だった。実際には
      # 2026-08-18から約2ヶ月間ずっと落ちていて誰も気づかず、data/rakuten-links.json は
      # 8/17で止まり、直近2ヶ月の新着（一番クリックされる層）が導線なしになっていた。
      # continue-on-error は維持しつつ、黙って腐らないよう次のステップで通知する。
      - name: Build Rakuten purchase links
        id: rakuten
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: node scripts/build-rakuten-links.js

      # 楽天ステップが落ちたらDiscordに通知する。
      # continue-on-error のステップは job を失敗させないので outcome を直接見る。
      #
      # 毎ラン（1日3〜5回）鳴る。時刻でランを絞ろうとしたが、GitHubのcronは実測で
      # 1〜2時間遅れて発火する（23:00UTC指定が01:23UTCに来ている）ため「朝のランだけ」
      # という条件が当てにならない。リダイレクト警告と同じく毎ラン鳴らす設計に揃えた。
      # 鳴りやませたい＝直せば止まる、で自己完結する。
      #
      # 経過日数はファイルのmtimeではなくJSONの中身(checkedAt)から出す。
      # checkout直後のmtimeはチェックアウト時刻になるので常に0日と出てしまう。
      - name: Notify Discord if Rakuten step failed
        if: steps.rakuten.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STALE=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('data/rakuten-links.json','utf8'));
              const ts = Object.values(d).map(v => v && v.checkedAt).filter(Boolean);
              console.log(ts.length ? Math.floor((Date.now() - Math.max(...ts)) / 86400000) : '?');
            } catch (e) { console.log('?') }
          ")
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **楽天リンク生成が失敗しています**（商品更新とInstagramは正常）。\nrakuten-links.json は約 ${STALE} 日更新されておらず、新着商品に楽天導線が付いていません。\n原因はActionsログの \`Build Rakuten purchase links\` に出ています。\`API Configuration not found\` なら楽天Developers側でアプリのAPI設定が消えているので、App ID / Access Key の再発行と Secrets 差し替えが必要です。\"}" \
            "$DISCORD_WEBHOOK_URL"
          echo "⚠️ 楽天ステップの失敗をDiscordに通知しました"

      - name: Generate AI descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-descriptions.js

      # ── 食玩（バンダイ キャンディ） ─────────────────────────────
      #
      # JST朝のランだけ実行する。バンダイ側が「毎月月初・中旬に更新」と明記しており、
      # 1日3回叩いても取れるものは変わらない。ラン数も負荷も増やさないための分岐。
      #
      # 取得は当月＋翌月の2ページのみ＝2リクエスト。
      # 画像は自前で持たず、楽天APIの商品画像を直リンクで表示する
      # （バンダイが画像の複製・転載を断っているため。scripts/collect-shokugan.js に経緯）。
      #
      # continue-on-error: 食玩はまだ試験的なカテゴリで、ここが落ちても
      # ガチャ本体の更新・Instagram・Discord は止めない。
      - name: Check if shokugan should run
        id: shokugan_gate
        run: |
          JST_HOUR=$(node -e "console.log((new Date().getUTCHours()+9)%24)")
          if [ "$JST_HOUR" -ge 6 ] && [ "$JST_HOUR" -le 11 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "JST ${JST_HOUR}時台なので食玩を更新します"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "JST ${JST_HOUR}時台なので食玩はスキップします（朝の1ランのみ）"
          fi

      - name: Collect shokugan
        if: steps.shokugan_gate.outputs.run == 'true'
        id: shokugan_collect
        continue-on-error: true
        run: node scripts/collect-shokugan.js

      - name: Enrich shokugan
        if: steps.shokugan_collect.outcome == 'success'
        continue-on-error: true
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: node scripts/enrich-shokugan.js

      - name: Generate shokugan descriptions
        if: steps.shokugan_collect.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: '20'
        run: node scripts/generate-shokugan-descriptions.js

      # 楽天の候補画像から販促バナーの無いものをAIで選ぶ。
      #
      # 市場APIが返すのは店舗の出品画像で「送料無料」「500円OFFクーポン」「20個」が
      # 焼き込まれていることが多く、そのままでは商品情報ページに出せない。
      # 複数店舗の候補から選ばせると実測で採用率88%・1件$0.0049。
      #
      # 採用済み（cleanImage がある）商品は対象外。さらに、判定した候補セットを
      # 記録して**候補が増えた時だけ**再判定する（scripts/image-pick-state.js）。
      # これを入れる前は、候補が全部バナー入りだった22件を毎日判定し直していて
      # 月$2を超え、14日目に上限で止まったうえ新商品の順番が回ってこなかった。
      # 新商品は月40〜45件なので運用は月$0.15程度の見込み。
      # それでも上限を超えそうなときは scripts 側が exit 78 で止まる（下で通知する）。
      - name: Pick clean shokugan images
        if: steps.shokugan_collect.outcome == 'success'
        id: shokugan_images
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          LIMIT: '20'
          MONTHLY_BUDGET: '0.30'
          MAX_SPEND: '0.10'
          # 記録先の枠。GITHUB_ACTIONS からも ci と判定されるが、
          # どの枠に乗るかはここを読めば分かるようにしておく。
          LEDGER: 'ci'
        run: node scripts/pick-shokugan-images.js

      # exit 78 は「今月の予算上限に達した」の意味（scripts/pick-shokugan-images.js）。
      # 失敗との区別がつくよう、専用のメッセージで通知する。
      - name: Notify Discord if shokugan image budget hit
        if: steps.shokugan_images.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SPENT=$(node -e "try{const s=require('./data/shokugan-image-spend.json');const b=s.ci||s;console.log('\$'+b.usd.toFixed(3)+'（'+b.judged+'件）')}catch(e){console.log('不明')}")
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **食玩の画像判定が止まりました**。\n今月の**CI枠**が ${SPENT} で、上限 \\\$0.30 に達した可能性があります（または実行時エラー）。\n手動実行ぶんは別枠なのでこの判定には含まれません。\n画像が付かないだけで、食玩の掲載・ガチャ本体には影響しません。\n詳細はActionsログの \`Pick clean shokugan images\` を確認してください。\"}" \
            "$DISCORD_WEBHOOK_URL"

      # タカラトミーアーツ商品の一覧画像を楽天から選ぶ。
      #
      # タカトミのサイトポリシーが非営利・私的使用を除く無断使用を禁じているため、
      # 権利管理が厳しいIP（lib/strict-ip.js の70件）は自前コピーを置けず、
      # 楽天画像に頼っている。新商品は月45件入るので、CIに入れておかないと
      # 新しいタカトミ商品に画像が付かないまま積み上がる。
      #
      # 食玩と同じ仕組みで、候補が増えた時だけ判定する。見送りが3回続いた商品は外す。
      - name: Pick gacha images from Rakuten
        id: gacha_images
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          LIMIT: '15'
          MONTHLY_BUDGET: '0.30'
          MAX_SPEND: '0.10'
          LEDGER: 'ci'
        run: node scripts/pick-gacha-images.js

      # exit 78 は「今月の予算上限に達した」の意味（scripts/pick-gacha-images.js）。
      - name: Notify Discord if gacha image budget hit
        if: steps.gacha_images.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SPENT=$(node -e "try{const s=require('./data/gacha-image-spend.json');const b=s.ci||s;console.log('\$'+b.usd.toFixed(3)+'（'+b.judged+'件）')}catch(e){console.log('不明')}")
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **ガチャ商品の画像判定が止まりました**。\n今月の**CI枠**が ${SPENT} で、上限 \\\$0.30 に達した可能性があります（または実行時エラー）。\n手動実行ぶんは別枠なのでこの判定には含まれません。\nタカラトミーアーツの新商品に画像が付かないだけで、掲載自体には影響しません。\n詳細はActionsログの \`Pick gacha images from Rakuten\` を確認してください。\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord if shokugan collection failed
        if: steps.shokugan_collect.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '{"content":"⚠️ **食玩の収集が失敗しました**（ガチャ本体の更新は正常）。\nバンダイ キャンディのカレンダーページの構造が変わった可能性があります。\nActionsログの `Collect shokugan` を確認してください。"}' \
            "$DISCORD_WEBHOOK_URL"

      # 一覧のサムネイルを生成して Cloudflare R2（gachaimg.com）へ上げる。
      # Vercelの画像最適化（Hobby無料枠）を使い切って新規変換が402で止まったため
      # next/image をやめ、さらにCDNリクエスト枠も超えたのでR2配信にした。
      # 未生成のぶんだけ作るので、毎日の実行で叩くのは新商品ぶんだけ。
      #
      # 【R2_* を渡すのを省略しないこと】
      # 認証情報が無いと build-thumbs.js はローカル配信モードに落ち、生成済み判定が
      # fs.existsSync(public/thumb/) になる。public/thumb/ は .gitignore なので
      # CIのチェックアウト直後は常に空で、**毎ラン全件を仕入れ元CDNから作り直す**。
      # しかも thumb に絶対URLではなく相対パスが入り、R2へ上がらないため、
      # 新商品は 301 でR2へ飛んだ先が404になる（Cloudflareは404を4時間キャッシュする）。
      # 2026-10-13のR2移行時に env を付け忘れ、実際に毎ラン277件を再取得していた。
      #
      # continue-on-error: 仕入れ元CDNの一時的な不調でパイプライン全体を止めない。
      # 取れなかった商品は仕入れ元URLで表示され、翌日の実行で再挑戦される。
      - name: Build product thumbnails
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/build-thumbs.js

      - name: Generate Instagram post images
        run: node scripts/generate-post.js

      # 投稿画像はInstagram公開後は不要（サイトからは未参照）。
      # 残し続けるとデプロイサイズが際限なく増えるため古いものを落とす。
      - name: Remove old post images
        run: node scripts/cleanup-posts.js

      - name: Commit and push if changed
        id: push_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/new-today.json data/collected.json data/rakuten-links.json
          # 食玩。存在しない時期（収集が一度も成功していない等）があるので保護する。
          git add data/shokugan.json 2>/dev/null || true
          # 画像判定の月次コスト記録。これをコミットしないと毎ラン0から数え直しになり、
          # 上限のガードが効かなくなる。
          # ガチャ側を足し忘れていて、まさにその状態だった（2026-10-14に修正）。
          # 記録は { month, ci: {...}, manual: {...} } で、CIが書くのは ci 枠だけ。
          git add data/shokugan-image-spend.json 2>/dev/null || true
          git add data/gacha-image-spend.json 2>/dev/null || true
          git add -A public/posts/
          # public/thumb/ はコミットしない（2026-10-13にCloudflare R2へ移行）。
          # build-thumbs.js がR2へ直接アップロードし、products.json には
          # https://gachaimg.com/thumb/... の絶対URLが入る。理由は .gitignore に記載。
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🎪 auto-update products $(date -u +%Y-%m-%d)"

          # 【なぜ押し直すか】
          # ランの実行中に人がpushすると、チェックアウトが古いので push が
          #   ! [rejected] main -> main (fetch first)
          # で弾かれ、このランの収集結果がまるごと落ちる（2026-10-14に実際に起きた。
          # Instagram投稿も含めて以降のステップが全部skipされた）。
          #
          # まず素でpushを試し、弾かれたときだけ origin/main を取り込んで押し直す。
          # 先にpullしない理由は、衝突が無い通常時に余計な操作とリスクを足さないため。
          #
          # 【衝突したら自動解決しない】
          # data/products.json や data/*-image-spend.json でCIと人の変更が重なると、
          # どちらを採っても片方が壊れる:
          #   CI側を採る … 人の編集（例: rakutenThumb の付与）が消える。再導出できない
          #   人側を採る … CIがその日収集した新商品が消える。次のランで再収集される
          # spendファイルはさらに悪く、CIは ci 枠・人は manual 枠を書くので
          # どちらを採っても片方の予算ガードが壊れる。
          # よって衝突時は中断して失敗させる。CI側のデータは次のランで再導出されるが、
          # 人の編集はされないので、黙って混ぜるより落とす方が安全。
          for i in 1 2 3; do
            if git push; then
              echo "push 成功（試行 $i 回目）"
              exit 0
            fi
            echo "pushが弾かれた。origin/main を取り込んで再試行する（$i/3）"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::rebaseが衝突した。このランのdata変更は破棄する（次のランが収集し直す）"
              exit 1
            fi
          done
          echo "::error::3回試してもpushできなかった"
          exit 1

      # 【条件について】
      # steps.push_data.outcome だけで書くと、GitHubが暗黙に success() を足すため
      # 「直前のステップが失敗している」この状況では常に false になり、通知が飛ばない。
      # always() を明示して、そのうえで push_data 自身の失敗だけに絞る。
      # failure() 単体だと他のステップの失敗でも「pushに失敗」と誤通知してしまう。
      # 他のステップが先に落ちた場合、push_data は skipped になるのでここは鳴らない。
      - name: Notify Discord if data push failed
        if: always() && steps.push_data.outcome == 'failure'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ **データのpushに失敗しました**。\nCI実行中に別のpushが入り、rebaseが衝突した可能性があります。\nこのランの収集結果は破棄されましたが、**次のランが収集し直すので恒久的な欠落にはなりません**。\nただし**このランのInstagram投稿はスキップ**されます。取りこぼしたくない場合は Actions から手動で再実行してください。\n詳細はActionsログの \`Commit and push if changed\` を確認してください。\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Wait for Vercel deploy
        run: |
          echo "⏳ Vercelデプロイ待機 (60秒)..."
          sleep 60

      # 更新したURLをIndexNow（Bing/Yandex等）に即時通知する。
      # GA4実測(2026-08-19)で bing/organic が流入の約4割を占めており、
      # 1日3回更新するこのサイトはプッシュ通知の効きが大きい。
      #
      # デプロイ待機の「後」に置くこと。先に通知すると、まだ反映されていない
      # 古い内容をクロールされて逆効果になる。
      #
      # continue-on-error: 通知は補助施策なので、失敗してもInstagram投稿や
      # Discord通知という本体パイプラインは止めない。
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/ping-indexnow.js

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish-instagram.js

      - name: Commit Instagram posted log (if changed)
        run: |
          if [ ! -f data/instagram-posted-log.json ]; then
            echo "posted log not found; skip"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram-posted-log.json
          git diff --staged --quiet || git commit -m "chore: Instagram投稿ログを更新"
          git push

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 今回のランで新規追加があるか確認
          NEW_COUNT=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('data/new-today.json','utf8'));console.log(d.length)}catch(e){console.log(0)}")
          TODAY=$(date -u +%Y-%m-%d)
          # 今回生成されたファイルのみ対象（JST時間で絞り込み）
          JST_HOUR=$(node -e "const h=(new Date().getUTCHours()+9)%24; console.log(String(h).padStart(2,'0'))")
          SENT=0

          if [ "$NEW_COUNT" -gt 0 ]; then
            for PNG_FILE in public/posts/post-${TODAY}-${JST_HOUR}h-*.png; do
              [ -f "$PNG_FILE" ] || continue
              TXT_FILE="${PNG_FILE%.png}.txt"

              if [ -f "$TXT_FILE" ]; then
                CAPTION=$(cat "$TXT_FILE")
                curl -s -F "content=${CAPTION}" -F "file1=@${PNG_FILE}" "$DISCORD_WEBHOOK_URL"
                SENT=$((SENT + 1))
                sleep 2
              fi
            done
          fi

          if [ "$SENT" -gt 0 ]; then
            echo "✅ Discord通知完了: ${SENT}件"
          else
            curl -s -H "Content-Type: application/json" \
              -d '{"content":"📢 本日の新着ガチャ情報はありませんでした。\n\n最新のガチャ情報はこちらからチェック！\n🔗 https://gacha-now.net"}' \
              "$DISCORD_WEBHOOK_URL"
            echo "⏭️ 新着なし、Discord通知（新着なしメッセージ）を送信"
          fi

      # 退役商品の301は next.config.js が毎ビルド組み立てる。保持365日なので
      # 消えずに積み上がり、月初の一斉入荷（毎月125〜153件）が3ヶ月後の退役で
      # そのまま乗ってくる。2026-09-02時点で506件。
      #
      # Vercelにはルート数の上限があり、超えると「next build は通るのに本番
      # デプロイだけ落ちる」という壊れ方をする。2026-09-01のEdge Function
      # 1MB超過（OG画像がproducts.jsonをimportしていた）と同じで、ローカルでは
      # 再現しないため切り分けに丸一日かかった。同じ轍を踏まないよう先に知らせる。
      #
      # 対処は next.config.js の RETENTION_DAYS を縮めるだけ。
      # 件数は next.config.js の redirects() をそのまま呼んで数える
      # （ここにロジックを写すと本体と必ずズレるため）。
      #
      # continue-on-error: 警告は補助施策なので、失敗してもパイプラインは止めない。
      - name: Warn if redirects are piling up
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WARN_THRESHOLD: '800'
        run: |
          COUNT=$(node -e "require('./next.config.js').redirects().then(r=>console.log(r.length))")
          echo "リダイレクト数: ${COUNT} / 閾値 ${WARN_THRESHOLD}"

          if [ "$COUNT" -ge "$WARN_THRESHOLD" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ **リダイレクトが ${COUNT} 件**になりました（閾値 ${WARN_THRESHOLD}）。\nVercelのルート数上限に近づいています。超えると本番デプロイだけが落ちます（next build では気づけません）。\n対処: next.config.js の RETENTION_DAYS を縮めて古い301を落としてください。\"}" \
              "$DISCORD_WEBHOOK_URL"
            echo "⚠️ 閾値超過をDiscordに通知しました"
          fi

