# .github/workflows/publish-social.yml
#
# 毎日 9時・12時・18時（日本時間）に:
# 1. Instagram投稿（新着なければスキップ）
# 2. Discord通知（新着なければスキップ）
#
# 9時実行時はupdate-products.ymlのVercelデプロイが完了するまで待機が必要なため
# 120秒のsleepを入れる。

name: Publish Social
on:
  schedule:
    # 0:00 UTC = JST 9:00
    - cron: '0 0 * * *'
    # 3:00 UTC = JST 12:00
    - cron: '0 3 * * *'
    # 9:00 UTC = JST 18:00
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Wait for Vercel deploy (9:00 JST run only)
        run: |
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" = "00" ]; then
            echo "⏳ 9時実行: Vercelデプロイ待機 (120秒)..."
            sleep 120
          else
            echo "⏭️ Vercel待機スキップ (${HOUR_UTC}時UTC実行)"
          fi

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/publish-instagram.js

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          SENT=0

          for PNG_FILE in public/posts/post-${TODAY}-*.png; do
            [ -f "$PNG_FILE" ] || continue
            IDX=$(echo "$PNG_FILE" | grep -oP '(?<=-)\d+(?=\.png)')
            TXT_FILE="public/posts/post-${TODAY}-${IDX}.txt"

            if [ -f "$TXT_FILE" ]; then
              CAPTION=$(cat "$TXT_FILE")
              curl -s -F "content=${CAPTION}" -F "file1=@${PNG_FILE}" "$DISCORD_WEBHOOK_URL"
              SENT=$((SENT + 1))
              sleep 2
            fi
          done

          if [ "$SENT" -gt 0 ]; then
            echo "✅ Discord通知完了: ${SENT}件"
          else
            echo "⏭️ 新着なし、Discord通知スキップ"
          fi
